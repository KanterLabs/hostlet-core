name: Feature request
description: Propose an improvement to Hostlet Core
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What self-hosted workflow is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible outcome rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How are you handling this today?
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This request is for the public self-hosted Core, not hosted-service billing or private infrastructure.
          required: true
