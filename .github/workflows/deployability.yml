name: Deployability CI

on:
  push:
    branches:
      - main
  schedule:
    # Nightly safety net for these heavy suites against staging — they no longer
    # run on every staging push. Pairs with the release gate (see release.yml).
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTLET_ALLOWED_RUNNER_PREFIX: homelab-

concurrency:
  group: deployability-${{ github.event_name == 'schedule' && 'staging' || github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    name: release-evidence
    runs-on: homelab
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse_heavy: ${{ steps.detect.outputs.reuse_heavy }}
    steps:
      - name: Check out base-owned release evidence evaluator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # On a main push, use the trusted pre-push main tip; release PR code
          # must not be able to rewrite the detector that decides reuse.
          ref: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          path: .hostlet-release-evidence
          sparse-checkout: |
            /scripts/ci-release-evidence.py
            /scripts/release-candidate.py
            /scripts/ci-verify-runner.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
        working-directory: .hostlet-release-evidence
      - id: detect
        name: Detect exact merged release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTLET_RELEASE_EVIDENCE_MODE: main
        run: |
          set -euo pipefail
          if [ ! -f .hostlet-release-evidence/scripts/ci-release-evidence.py ] ||
            [ ! -f .hostlet-release-evidence/scripts/release-candidate.py ]; then
            echo "trusted release evidence evaluator is absent on the pre-push base; keeping heavy CI enabled"
            echo "reuse_heavy=false" >> "${GITHUB_OUTPUT}"
          else
            python3 .hostlet-release-evidence/scripts/ci-release-evidence.py
          fi

  generated-apps:
    needs: [release-evidence]
    if: needs.release-evidence.outputs.reuse_heavy != 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: homelab-heavy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Scheduled runs validate staging, not the default branch.
          ref: ${{ github.event_name == 'schedule' && 'staging' || '' }}
      - run: scripts/ci-verify-runner.sh
      - run: scripts/ci-install-railpack.sh
      - run: test -x "${HOSTLET_RAILPACK_BIN}"
      - run: scripts/ci-railpack-generated-fixtures.sh
        env:
          HOSTLET_RAILPACK_METRICS_FILE: ${{ github.workspace }}/reports/railpack-generated-fixtures-metrics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: railpack-generated-fixtures-metrics
          path: reports/railpack-generated-fixtures-metrics.json
          if-no-files-found: warn
          retention-days: 14

  self-hosted-api:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: homelab
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Scheduled runs validate staging, not the default branch.
          ref: ${{ github.event_name == 'schedule' && 'staging' || '' }}
      - run: scripts/ci-verify-runner.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: scripts/ci-self-hosted-api-smoke.sh

  patchwork-canary:
    needs: [release-evidence]
    if: needs.release-evidence.outputs.reuse_heavy != 'true' && github.event_name == 'schedule'
    continue-on-error: true
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
      HOSTLET_E2E_SKIP_RAILPACK_FIXTURES: "1"
      HOSTLET_TOPOLOGY_CANARY_REPO: ShaneKanterman04/patchwork-pirates
      HOSTLET_TOPOLOGY_CANARY_SHA: fae18d0fab8bc5586a33af598fa4371a06f51576
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: staging
      - run: scripts/ci-verify-runner.sh
      - run: scripts/ci-install-railpack.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: scripts/ci-self-hosted-deploy-e2e.sh
