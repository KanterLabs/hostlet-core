name: Staging Pull Request

# Team-plan trust boundary: `pull_request` YAML is PR-controlled. Same-repo
# writers who can label are staging deploy admins; fork PRs fail the same-repo
# guard. Loading the aggregate helper from the exact base SHA narrows but does
# not eliminate this boundary without default-branch workflow ownership.
#
# Bootstrap: the first PR adding this file and its evaluator cannot satisfy the
# aggregate check because the evaluator is not present on its base SHA yet.

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

env:
  HOSTLET_ALLOWED_RUNNER_PREFIX: homelab-
  HOSTLET_STAGING_PR_APPROVAL_LABEL: staging-homelab-ci-approved

concurrency:
  group: staging-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revoke-approval-on-update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened') &&
      contains(github.event.pull_request.labels.*.name, 'staging-homelab-ci-approved')
    runs-on: homelab
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Revoke stale staging homelab approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          status="$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /dev/null \
            -w '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${HOSTLET_STAGING_PR_APPROVAL_LABEL}")"
          case "${status}" in
            200|404) ;;
            *)
              echo "failed to revoke stale staging PR approval (HTTP ${status})" >&2
              exit 1
              ;;
          esac

  secrets:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/ci-verify-runner.sh
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --redact --verbose

  rust:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: scripts/check-line-cap.sh
      - run: scripts/check-line-cap-selftest.sh
      - run: scripts/check-migration-versions.sh
      - run: bash scripts/ci-db-tests-selftest.sh
      - run: scripts/ci-self-hosted-lib-selftest.sh
      - run: bash scripts/ci-release-mainline-gate-selftest.sh
      - run: scripts/ci-core-workflow-contracts.sh
      - run: scripts/ci-verify-runner-selftest.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  database:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      HOSTLET_DB_TEST_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: hostlet_ci
          POSTGRES_PASSWORD: hostlet-ci-test-password
          POSTGRES_DB: hostlet_ci_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hostlet_ci -d hostlet_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Run destructive database tests against ephemeral Postgres
        env:
          HOSTLET_DB_TEST_URL: postgresql://hostlet_ci:hostlet-ci-test-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/hostlet_ci_test
        run: bash scripts/ci-db-tests.sh

  web:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: ../../scripts/ci-verify-runner.sh
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: ../../scripts/ci-web-route-smoke.sh
      - run: pnpm exec playwright install chromium
      - run: pnpm test:web
      - run: pnpm responsive:qa
      - run: ../../scripts/ci-security-artifact-smoke.sh

  compose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret-postgres
      PUBLIC_API_URL: http://localhost:8080
      PUBLIC_WEB_URL: http://localhost:3000
      HOSTLET_SETUP_TOKEN: ci-only-not-a-secret-setup-token-01
      HOSTLET_ALLOWED_GITHUB_LOGINS: ci-user
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      JOB_SIGNING_SECRET: ci-only-not-a-secret-job-signing-01
      SESSION_SECRET: ci-only-not-a-secret-session-secret-01
      LOCAL_AGENT_TOKEN: ci-only-not-a-secret-agent-token-01
      GITHUB_WEBHOOK_SECRET: ci-only-not-a-secret-webhook-secret-01
      HOSTLET_IMAGE_TAG: v0.5.0
      HOSTLET_API_IMAGE: ghcr.io/shanekanterman04/hostlet-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HOSTLET_WEB_IMAGE: ghcr.io/shanekanterman04/hostlet-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HOSTLET_AGENT_IMAGE: ghcr.io/shanekanterman04/hostlet-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HOSTLET_SCREENSHOTTER_IMAGE: ghcr.io/shanekanterman04/hostlet-screenshotter@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HOSTLET_ARTIFACT_REGISTRY_PUSH_USERNAME: hostlet-builder
      HOSTLET_ARTIFACT_REGISTRY_PUSH_PASSWORD: ci-only-registry-push
      HOSTLET_ARTIFACT_REGISTRY_PULL_USERNAME: hostlet-runner
      HOSTLET_ARTIFACT_REGISTRY_PULL_PASSWORD: ci-only-registry-pull
      DOCKER_GID: "998"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - run: docker compose -f infra/docker-compose.yml config >/dev/null
      - run: docker compose -f infra/docker-compose.prod.yml config >/dev/null

  docker:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - run: scripts/ci-docker-retry.sh docker build -f apps/web/Dockerfile -t hostlet-web-ci .
      - run: scripts/ci-docker-retry.sh docker build -f apps/api/Dockerfile -t hostlet-api-ci .
      - run: scripts/ci-docker-retry.sh docker build -f apps/agent/Dockerfile -t hostlet-agent-ci .
      - run: scripts/ci-screenshotter-smoke.sh

  topology-e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
      HOSTLET_E2E_SKIP_RAILPACK_FIXTURES: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - run: scripts/ci-install-railpack.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: scripts/ci-self-hosted-deploy-e2e.sh

  remote-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'staging-homelab-ci-approved'
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: scripts/ci-remote-build-e2e.sh

  staging-pr-gate:
    name: staging-pr-gate
    if: always()
    needs: [revoke-approval-on-update, secrets, rust, database, web, compose, docker, topology-e2e, remote-build]
    runs-on: homelab
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the base-owned aggregate gate only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .hostlet-staging-pr-gate
          sparse-checkout: /scripts/ci-staging-pr-gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require successful dependencies and live current-head approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOSTLET_STAGING_PR_RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 .hostlet-staging-pr-gate/scripts/ci-staging-pr-gate.py
