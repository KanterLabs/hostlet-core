name: Staging

# Push to the always-alive `staging` branch -> build moving staging images and
# open a hostlet-cloud pin PR for this exact Core tip after publication succeeds.
# No version-match gate here: staging tracks the branch, not a release tag.
# Release-only proof is dispatched separately for an explicitly selected SHA.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTLET_ALLOWED_RUNNER_PREFIX: homelab-

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: homelab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  rust:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: homelab-heavy
    env:
      # This full workspace check owns the isolated 8-CPU heavy runner.
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - run: scripts/check-line-cap.sh
      - run: bash scripts/ci-db-tests-selftest.sh
      - run: scripts/ci-self-hosted-lib-selftest.sh
      - run: bash scripts/ci-release-mainline-gate-selftest.sh
      - run: scripts/ci-core-workflow-contracts.sh
      - run: scripts/ci-verify-runner-selftest.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  database:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/database-tests.yml

  web:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: homelab-heavy
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: ../../scripts/ci-verify-runner.sh
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  topology-e2e:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
      HOSTLET_E2E_SKIP_RAILPACK_FIXTURES: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - run: scripts/ci-install-railpack.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: scripts/ci-self-hosted-deploy-e2e.sh

  remote-build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: homelab-heavy
    env:
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - name: Use runner's cached rustup
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: scripts/ci-remote-build-e2e.sh

  images:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    needs: [secrets, rust, database, web, topology-e2e, remote-build]
    runs-on: homelab-heavy
    steps:
      - name: Isolate docker credentials for this run
        # Per-run DOCKER_CONFIG keeps registry credentials in this ephemeral
        # job's state and adds defense in depth against accidental auth reuse.
        run: |
          cfg="$RUNNER_TEMP/docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$cfg"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - name: Compute image tags
        run: echo "SHA_TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ShaneKanterman04
        run: echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
      - name: Build and push staging images
        env:
          IMAGE_REGISTRY: ghcr.io/shanekanterman04
        run: |
          for app in api web agent screenshotter; do
            scripts/ci-docker-retry.sh docker build \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
              --label org.opencontainers.image.version="staging" \
              -f "apps/${app}/Dockerfile" \
              -t "${IMAGE_REGISTRY}/hostlet-${app}:staging" \
              -t "${IMAGE_REGISTRY}/hostlet-${app}:${SHA_TAG}" \
              .
            if [ "${app}" = "screenshotter" ]; then
              HOSTLET_SCREENSHOTTER_TEST_IMAGE="${IMAGE_REGISTRY}/hostlet-screenshotter:${SHA_TAG}" \
              HOSTLET_SCREENSHOTTER_SKIP_BUILD=1 \
                scripts/ci-screenshotter-smoke.sh
            fi
            scripts/ci-docker-retry.sh docker push "${IMAGE_REGISTRY}/hostlet-${app}:staging"
            scripts/ci-docker-retry.sh docker push "${IMAGE_REGISTRY}/hostlet-${app}:${SHA_TAG}"
          done

  pin-cloud-staging:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    needs: [images]
    runs-on: homelab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: scripts/ci-verify-runner.sh
      - name: Check out Cloud staging pin automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: KanterLabs/hostlet-cloud
          ref: staging
          token: ${{ secrets.CLOUD_DISPATCH_PAT }}
          path: hostlet-cloud
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Open the exact Core staging pin pull request
        working-directory: hostlet-cloud
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_PAT }}
        run: scripts/update-core-staging-pin.sh "${GITHUB_SHA}"
